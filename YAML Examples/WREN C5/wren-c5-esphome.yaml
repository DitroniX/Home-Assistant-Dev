# This YAML code has been created to show the features and functionality of WREN C5.
# This code has expanded to become an all encompassing ESPHome applicaition and is a fully working baseline.

esphome:
  name: wrenc5
  friendly_name: WREN C5
  name_add_mac_suffix: true

  on_boot:
    priority: 800
    then:
      - lambda: |-

          uint8_t cfg[2] = {0x03,0x00};
          id(bus_a).write(0x21,cfg,2);

          uint8_t pol[2] = {0x02,0x00};
          id(bus_a).write(0x21,pol,2);

          uint8_t out[2] = {0x01,0x00};
          id(bus_a).write(0x21,out,2);

          ESP_LOGI(
            "tca",
            "TCA6408A initialized"
          );

          // Publish restored positions to sliders on boot
          id(motor_1_slider).publish_state(id(motor1_pos));
          id(motor_2_slider).publish_state(id(motor2_pos));
          id(motor1_target) = id(motor1_pos);
          id(motor2_target) = id(motor2_pos);

      - delay: 500ms

      - if:
          condition:
            binary_sensor.is_on: sflag
          then:
            - logger.log: "SFLAG ACTIVE AFTER BOOT"
            - script.execute: fault_handler

esp32:
  board: esp32-c5-devkitc-1
  variant: esp32c5

  framework:
    type: esp-idf

################################## ESPHOME ##################################

# ======================== ESPHome - Enter Below your Key/Pasawords ===========================

api:
  encryption:
    key: !secret wren_c5__encryption_key

ota:
  - platform: esphome
    password: !secret wren_c5__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: WREN C5 Fallback Hotspot
    password: !secret wren_c5__ap_password
captive_portal:

logger:

################################## SUBSTITUTIONS ##################################
substitutions:
  # ======================== About ===========================

  author: "DitroniX - Dave Williams"
  firmware_version: "1.00.03"
  release_date: "2026-06-22"
  board_name: "WREN C5"
  board_mcu: "ESP32-C5"
  board_rev: "1.2606.104"

  # ======================== Config ===========================

  voltage_low: 3.00
  voltage_high: 48.0

  travel_time_min: "1"
  travel_time_max: "60"
  travel_time_step: "1"

  motor1_travel_time_default: "12"
  motor2_travel_time_default: "12"

################################## SETUP ##################################

# ========================== GPIO =============================

i2c:
  id: bus_a

  sda: GPIO2
  scl: GPIO3

  scan: false

globals:
  - id: fault_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: tca_state
    type: uint8_t
    restore_value: no
    initial_value: "0"

  - id: motor1_pos
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: motor1_target
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: motor1_overshoot_cnt
    type: int
    restore_value: no
    initial_value: "0"

  - id: motor1_is_overshooting
    type: bool
    restore_value: no
    initial_value: "false"

  - id: motor1_last_publish
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: motor1_was_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: motor2_pos
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: motor2_target
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: motor2_overshoot_cnt
    type: int
    restore_value: no
    initial_value: "0"

  - id: motor2_is_overshooting
    type: bool
    restore_value: no
    initial_value: "false"

  - id: motor2_last_publish
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: motor2_was_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: motor1_moving_physically
    type: bool
    restore_value: no
    initial_value: "false"

  - id: motor2_moving_physically
    type: bool
    restore_value: no
    initial_value: "false"

################################## SWITCH ##################################
switch:
  - platform: gpio
    id: rs485_enable
    pin: GPIO23
    restore_mode: ALWAYS_ON

output:
  - platform: gpio
    pin: GPIO27
    id: blue_led

################################## LIGHT ######################################
light:
  - platform: binary
    id: heartbeat
    output: blue_led

################################## NUMBER ######################################
number:
  - platform: template
    id: motor_1_travel_time
    name: "Motor 1 Travel Time"
    entity_category: config
    icon: mdi:timer
    optimistic: true
    restore_value: true
    min_value: ${travel_time_min}
    max_value: ${travel_time_max}
    step: ${travel_time_step}
    unit_of_measurement: "s"
    initial_value: ${motor1_travel_time_default}

  - platform: template
    id: motor_2_travel_time
    name: "Motor 2 Travel Time"
    entity_category: config
    icon: mdi:timer
    optimistic: true
    restore_value: true
    min_value: ${travel_time_min}
    max_value: ${travel_time_max}
    step: ${travel_time_step}
    unit_of_measurement: "s"
    initial_value: ${motor2_travel_time_default}

  - platform: template
    name: "Motor 1 Position"
    id: motor_1_slider
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    icon: mdi:seat-recline-extra
    set_action:
      - lambda: |-
          id(motor1_target) = x;
          ESP_LOGD("motor1", "New target set: %.1f", x);

  - platform: template
    name: "Motor 2 Position"
    id: motor_2_slider
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    icon: mdi:seat-recline-extra
    set_action:
      - lambda: |-
          id(motor2_target) = x;
          ESP_LOGD("motor2", "New target set: %.1f", x);



################################## TEXT SENSOR ##################################

text_sensor:
  - platform: version
    id: esphome_version
    name: "ESPHome Version"
    entity_category: diagnostic
    icon: mdi:tag
    hide_timestamp: true
    hide_hash: true

  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    icon: mdi:application-cog
    lambda: |-
      return {"${firmware_version}"};

  - platform: template
    name: "Release Date"
    entity_category: diagnostic
    icon: mdi:calendar
    lambda: |-
      return {"${release_date}"};

  - platform: template
    name: "Supply Status"
    id: supply_status
    icon: mdi:power-plug
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      float v = id(supply_voltage).state;

      constexpr float VOLTAGE_LOW  = ${voltage_low};
      constexpr float VOLTAGE_HIGH = ${voltage_high};      

      if (v >= 5.5f && v <= 10.0f) {
        ESP_LOGI(
          "POWER",
          "Voltage Too Low %.2fV",
          v
        );      
        return {"Power Fail"};
      }      

      if (v >= 10.0f && v <= 20.0f) {
        return {"Low Voltage"};
      }      

      if (v >= 20.0f && v <= 30.0f) {
        return {"Recliner"};
      }      

      if (v >= 30.0f && v <= VOLTAGE_HIGH) {
        char buffer[20];
        snprintf(buffer, sizeof(buffer), "%.1fV", v);
        return {buffer};
      } 

      if (v > 48.0f) {
        ESP_LOGI(
          "POWER",
          "Over Voltage %.2fV",
          v
        );           
        return {"Over Voltage"};
      }  

      return {"Unknown"};

############################## BINARY SENSOR ###############################
binary_sensor:
  - platform: gpio
    id: in_1a
    name: "Motor 1 Extend"
    pin:
      number: GPIO8
      mode:
        input: true
        pulldown: true

  - platform: gpio

    id: in_1b
    name: "Motor 1 Retract"
    pin:
      number: GPIO9
      mode:
        input: true
        pulldown: true

  - platform: gpio
    id: in_2a
    name: "Motor 2 Extend"
    pin:
      number: GPIO14
      mode:
        input: true
        pulldown: true

  - platform: gpio
    id: in_2b
    name: "Motor 2 Retract"
    pin:
      number: GPIO13
      mode:
        input: true
        pulldown: true

  - platform: gpio
    id: sflag
    name: "Motor Driver Fault"
    pin:
      number: GPIO10
      mode:
        input: true
        pulldown: true

    on_press:
      then:
        - logger.log: "SFLAG INTERRUPT"
        - script.execute: fault_handler

  - platform: gpio
    id: en1
    name: "Motor 1 Driver Status"
    pin:
      number: GPIO5
      mode:
        input: true

  - platform: gpio
    id: en2
    name: "Motor 2 Driver Status"
    pin:
      number: GPIO6
      mode:
        input: true

################################## SENSOR ##################################
sensor:
  - platform: adc
    id: supply_voltage
    pin: GPIO4
    name: "Supply Voltage"
    attenuation: auto
    update_interval: 30s
    entity_category: diagnostic
    filters:
      - multiply: 44.4444

  - platform: tmp102
    name: "Board Temperature"
    address: 0x4A
    entity_category: diagnostic
    update_interval: 30s

  - platform: uptime
    name: "Uptime"

  # =====================================================
  # OTHER SENSORS
  # =====================================================

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s

################################## SCRIPT ##################################
script:
  - id: fault_handler
    mode: single
    then:
      - lambda: |-

          if(id(fault_active))
            return;

          id(fault_active)=true;

          ESP_LOGE(
            "FAULT - IMMEDIATE FAULT SHUTDOWN",
            "MOTOR STOP - TCA OUTPUT LOW. POWER CYCLE TO RE-ENABLE WREN"
            "HAVE A GREAT DAY!"
          );

          uint8_t off[2];
          off[0]=0x01;
          off[1]=0x00;

          id(bus_a).write(0x21, off, 2); 
          id(bus_a).write(0x21, off, 2); 
          id(bus_a).write(0x21, off, 2);

      - repeat:
          count: 20
          then:
            - lambda: |-

                uint8_t led[2];
                led[0]=0x01;

                // TCA BIT7 ON
                led[1]=0x80;

                id(bus_a).write(
                  0x21,
                  led,
                  2
                );

            - delay: 1000ms
            - lambda: |-

                uint8_t led[2];
                led[0]=0x01;

                // ALL OFF
                led[1]=0x00;

                id(bus_a).write(
                  0x21,
                  led,
                  2
                );
            - delay: 100ms

      # - lambda: |-
      #     ESP_LOGE(
      #       "FAULT",
      #       "RESTARTING"
      #     );
      #     esp_restart();

################################## INTERVAL ##################################
interval:
  # heartbeat

  - interval: 1s
    then:
      - light.turn_on: heartbeat
      - delay: 750ms
      - light.turn_off: heartbeat

  # motor supervisor

  - interval: 10ms

    then:
      - lambda: |-

          //
          // HARD SFLAG CHECK
          //

          if(id(sflag).state)
          {
            ESP_LOGE(
              "FAULT",
              "SFLAG HIGH"
            );

            id(fault_handler).execute();
            return;
            }          


          if(id(sflag).state)
          {
            id(fault_handler).execute();
            return;
          }

          //
          // LATCHED FAULT
          //

          if(id(fault_active))
          {
            uint8_t off[2]={0x01,0x00};

            id(bus_a).write(
              0x21,
              off,
              2
            );

            return;
          }

          //
          // VOLTAGE CHECK
          //

          constexpr float VOLTAGE_LOW  = ${voltage_low};
          constexpr float VOLTAGE_HIGH = ${voltage_high};

          float v = id(supply_voltage).state;

          if (v < VOLTAGE_LOW || v > VOLTAGE_HIGH)
          {
              ESP_LOGE("FAULT", "Voltage %.2fV out of range", v);
              id(fault_handler).execute();
              return;
          }

          //
          // MOTOR 1 CONTROL
          //
          bool m1_ext = false;
          bool m1_ret = false;

          bool in1a = id(in_1a).state; // Physical extend
          bool in1b = id(in_1b).state; // Physical retract

          float travel_time_1 = id(motor_1_travel_time).state;
          if (travel_time_1 < 1.0f) travel_time_1 = 1.0f;

          // Rate per 10ms interval (as a percentage 0-100)
          // 10ms is 0.01 seconds. So rate is (100.0 / time) * 0.01 = 1.0 / time.
          float ext_rate_1 = 1.0f / travel_time_1;
          float ret_rate_1 = 1.0f / travel_time_1;

          if (in1a && in1b) {
            // Safety interlock for physical inputs
            in1a = false;
            in1b = false;
          }

          if (in1a) {
            // Physical button extend
            id(motor1_is_overshooting) = false;
            id(motor1_overshoot_cnt) = 0;
            id(motor1_moving_physically) = true;
            m1_ext = true;
            id(motor1_pos) += ext_rate_1;
            if (id(motor1_pos) > 100.0f) {
              id(motor1_pos) = 100.0f;
            }
            id(motor1_target) = id(motor1_pos);
          } else if (in1b) {
            // Physical button retract
            id(motor1_is_overshooting) = false;
            id(motor1_overshoot_cnt) = 0;
            id(motor1_moving_physically) = true;
            m1_ret = true;
            id(motor1_pos) -= ret_rate_1;
            if (id(motor1_pos) < 0.0f) {
              id(motor1_pos) = 0.0f;
            }
            id(motor1_target) = id(motor1_pos);
          } else if (id(motor1_is_overshooting)) {
            // Currently in automated overshoot state
            id(motor1_overshoot_cnt)--;
            if (id(motor1_overshoot_cnt) <= 0) {
              id(motor1_is_overshooting) = false;
              // target has already been clamped to 0 or 100
              id(motor1_pos) = id(motor1_target);
            } else {
              if (id(motor1_target) >= 100.0f) {
                m1_ext = true;
              } else if (id(motor1_target) <= 0.0f) {
                m1_ret = true;
              }
            }
          } else {
            // Slider-driven target seeking
            float diff = id(motor1_target) - id(motor1_pos);
            // Use a tiny threshold to prevent endless jitter
            if (diff > 0.05f) {
              m1_ext = true;
              id(motor1_pos) += ext_rate_1;
              if (id(motor1_pos) >= id(motor1_target)) {
                if (id(motor1_target) >= 100.0f) {
                  // Trigger overshoot at 100%
                  id(motor1_is_overshooting) = true;
                  id(motor1_overshoot_cnt) = 150; // 1.5 seconds
                  id(motor1_pos) = 100.0f;
                } else {
                  id(motor1_pos) = id(motor1_target);
                }
              }
            } else if (diff < -0.05f) {
              m1_ret = true;
              id(motor1_pos) -= ret_rate_1;
              if (id(motor1_pos) <= id(motor1_target)) {
                if (id(motor1_target) <= 0.0f) {
                  // Trigger overshoot at 0%
                  id(motor1_is_overshooting) = true;
                  id(motor1_overshoot_cnt) = 150; // 1.5 seconds
                  id(motor1_pos) = 0.0f;
                } else {
                  id(motor1_pos) = id(motor1_target);
                }
              }
            }
          }

          // Throttle state publishing to Home Assistant to avoid network spam
          bool active1 = m1_ext || m1_ret;
          if (active1) {
            if (id(motor1_moving_physically)) {
              uint32_t now = millis();
              if (now - id(motor1_last_publish) >= 200 || !id(motor1_was_active)) {
                id(motor_1_slider).publish_state(id(motor1_pos));
                id(motor1_last_publish) = now;
              }
            }
          } else if (id(motor1_was_active)) {
            // Just stopped, publish final position
            id(motor_1_slider).publish_state(id(motor1_pos));
            id(motor1_last_publish) = millis();
            id(motor1_moving_physically) = false;
          }
          id(motor1_was_active) = active1;

          //
          // MOTOR 2 CONTROL
          //
          bool m2_ext = false;
          bool m2_ret = false;

          bool in2a = id(in_2a).state; // Physical extend
          bool in2b = id(in_2b).state; // Physical retract

          float travel_time_2 = id(motor_2_travel_time).state;
          if (travel_time_2 < 1.0f) travel_time_2 = 1.0f;

          float ext_rate_2 = 1.0f / travel_time_2;
          float ret_rate_2 = 1.0f / travel_time_2;

          if (in2a && in2b) {
            in2a = false;
            in2b = false;
          }

          if (in2a) {
            id(motor2_is_overshooting) = false;
            id(motor2_overshoot_cnt) = 0;
            id(motor2_moving_physically) = true;
            m2_ext = true;
            id(motor2_pos) += ext_rate_2;
            if (id(motor2_pos) > 100.0f) {
              id(motor2_pos) = 100.0f;
            }
            id(motor2_target) = id(motor2_pos);
          } else if (in2b) {
            id(motor2_is_overshooting) = false;
            id(motor2_overshoot_cnt) = 0;
            id(motor2_moving_physically) = true;
            m2_ret = true;
            id(motor2_pos) -= ret_rate_2;
            if (id(motor2_pos) < 0.0f) {
              id(motor2_pos) = 0.0f;
            }
            id(motor2_target) = id(motor2_pos);
          } else if (id(motor2_is_overshooting)) {
            id(motor2_overshoot_cnt)--;
            if (id(motor2_overshoot_cnt) <= 0) {
              id(motor2_is_overshooting) = false;
              id(motor2_pos) = id(motor2_target);
            } else {
              if (id(motor2_target) >= 100.0f) {
                m2_ext = true;
              } else if (id(motor2_target) <= 0.0f) {
                m2_ret = true;
              }
            }
          } else {
            float diff = id(motor2_target) - id(motor2_pos);
            if (diff > 0.05f) {
              m2_ext = true;
              id(motor2_pos) += ext_rate_2;
              if (id(motor2_pos) >= id(motor2_target)) {
                if (id(motor2_target) >= 100.0f) {
                  id(motor2_is_overshooting) = true;
                  id(motor2_overshoot_cnt) = 150;
                  id(motor2_pos) = 100.0f;
                } else {
                  id(motor2_pos) = id(motor2_target);
                }
              }
            } else if (diff < -0.05f) {
              m2_ret = true;
              id(motor2_pos) -= ret_rate_2;
              if (id(motor2_pos) <= id(motor2_target)) {
                if (id(motor2_target) <= 0.0f) {
                  id(motor2_is_overshooting) = true;
                  id(motor2_overshoot_cnt) = 150;
                  id(motor2_pos) = 0.0f;
                } else {
                  id(motor2_pos) = id(motor2_target);
                }
              }
            }
          }

          bool active2 = m2_ext || m2_ret;
          if (active2) {
            if (id(motor2_moving_physically)) {
              uint32_t now = millis();
              if (now - id(motor2_last_publish) >= 200 || !id(motor2_was_active)) {
                id(motor_2_slider).publish_state(id(motor2_pos));
                id(motor2_last_publish) = now;
              }
            }
          } else if (id(motor2_was_active)) {
            id(motor_2_slider).publish_state(id(motor2_pos));
            id(motor2_last_publish) = millis();
            id(motor2_moving_physically) = false;
          }
          id(motor2_was_active) = active2;

          //
          // TCA6408A OUTPUT GENERATION
          //
          uint8_t output=0;

          if (m1_ext || m1_ret) {
            output |= (1<<0); // EN1
          }

          if (m2_ext || m2_ret) {
            output |= (1<<3); // EN2
          }

          // MOTOR 1
          if(m1_ext)
            output |= (1<<1);

          if(m1_ret)
            output |= (1<<2);

          // MOTOR 2
          if(m2_ext)
            output |= (1<<4);

          if(m2_ret)
            output |= (1<<5);

          uint8_t buf[2];
          buf[0]=0x01;
          buf[1]=output;

          id(bus_a).write(
            0x21,
            buf,
            2
          );

          // ESP_LOGI(
          //   "motor",
          //   "OUT=0x%02X",
          //   output
          // );
