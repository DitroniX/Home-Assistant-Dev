# IBEM ESP32C3 IoT Battery Energy Invertor Current Monitor SDK Board
#
# Remember!
# - Set the BOARD to Use ESP32C3 Dev Module (or similar).
# - You can also set the BAUD rate up to 921600 to speed up flashing.
# - The SDK does NOT need external power to flash.  It will take Power from the USB 5V.
# - The Serial Monitor is configured for BAUD 115200
#
# This test code is OPEN SOURCE and formatted for easier viewing.  Although is is not intended for real world use, it may be freely used, or modified as needed.
# It is distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
#
# Further information, details and examples can be found on our website or github.com/DitroniX
#
#   * github.com/DitroniX
#   * github.com/DitroniX/IBEM-IoT-Battery-Energy-Monitor
#   * github.com/DitroniX/IBEM-IoT-Battery-Energy-Monitor/wiki
#   * hackster.io/DitroniX/ibem-esp32c3-iot-battery-energy-monitor-solar-inverters-0342b1

esphome:
  name: ibem-solar-charger-1
  friendly_name: Solar Charger 1
  
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(current_low_threshold).publish_state(atof("${current_low_default}"));
          id(current_mid_threshold).publish_state(atof("${current_mid_default}"));
          id(current_high_threshold).publish_state(atof("${current_high_default}"));          
          id(current_max_threshold).publish_state(atof("${current_max_default}"));  

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "xxxx"

ota:
  - platform: esphome
    password: "xxxx"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ibem-c3 Fallback Hotspot"
    password: "xxxx"

captive_portal:

# ---------------------------- SUBSTITUTIONS ---------------------------- #      
substitutions:
  author: "DitroniX - Dave Williams"
  firmware_version: "1.02.01"
  release_date: "2026-08-01"
  board_name: "IBEM C3"
  board_mcu: "ESP32-C3"
  board_target: "Solar Charger 1 Current"
  board_rev: "1.2404.102"

  ShowRAWADVals: "False"  
  
  current_low_default: "15"
  current_mid_default: "30"
  current_high_default: "50"
  current_max_default: "60"

# ---------------------------- GLOBALS ---------------------------- #      
globals:
  - id: DCCALValue
    type: float
    restore_value: yes
    initial_value: '0'

# ---------------------------- FONT ---------------------------- #    
font:
  - file: 'fonts/Arial.ttf'
    id: font24
    size: 24

# ---------------------------- I2C ---------------------------- #   
i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

ads1115:
  - address: 0x48

# ---------------------------- ONE-WIRE ---------------------------- #    
# DS18B20 Temperature Sensor
one_wire:
  - platform: gpio
    pin: GPIO6
    id: bus1  

# ---------------------------- BINARY SENSOR ---------------------------- #   
binary_sensor: # This calibrates to Zero current flow and stores the calibration value
  - platform: gpio
    pin: 
      number: GPIO9
      inverted: true
      mode: INPUT_PULLUP
    name: "User Button"

    on_press:
      then:
        - switch.turn_on: Blue_LED   
        - delay: '00:00:02'  
        - lambda: |-
              float VoltRaw2 = (id(a1_gnd).state + id(a2_gnd).state) - 3.3;
              float dcCAR = (VoltRaw2 / 0.013200);
              float dcCAR2 = roundf(dcCAR * 100000) / 100000;

              id(DCCALValue) = -dcCAR2;

              ESP_LOGD("Zero Calibration", "Value: %f Global Val: %f", dcCAR2, id(DCCALValue));
            
        - switch.turn_off: Blue_LED    
        
# ---------------------------- BUTTON ---------------------------- #        
button: # This calibrates to Zero current flow and stores the calibration value.    Important: Turn off Current Flow then Calibrate Zero.
  - platform: template
    name: "Zero Store Calibration Reading. Install. Turn off Current Flow then Calibrate Zero."
    entity_category: config
    on_press:
      then:
        - switch.turn_on: Blue_LED   
        - delay: '00:00:02'  
        - lambda: |-
              float VoltRaw2 = (id(a1_gnd).state + id(a2_gnd).state) - 3.3;
              float dcCAR = (VoltRaw2 / 0.013200);
              float dcCAR2 = roundf(dcCAR * 100000) / 100000;

              id(DCCALValue) = -dcCAR2;

              ESP_LOGD("Zero Calibration", "Value: %f Global Val: %f", dcCAR2, id(DCCALValue));
              
        - switch.turn_off: Blue_LED    

  - platform: template
    name: "Restore Threshold Defaults"
    entity_category: config
    on_press:
      - lambda: |-
          id(current_low_threshold).publish_state(atof("${current_low_default}"));
          id(current_mid_threshold).publish_state(atof("${current_mid_default}"));
          id(current_high_threshold).publish_state(atof("${current_high_default}"));          
          id(current_max_threshold).publish_state(atof("${current_max_default}"));   

# ---------------------------- SWITCH ---------------------------- # 
switch:
  - platform: gpio
    id: Red_LED
    internal: true
    name: "Red LED"  
    pin:
      number: GPIO10
      mode: output
    
  - platform: gpio
    id: Green_LED 
    internal: true
    name: "Green LED"  
    pin:
      number: GPIO18
      mode: output
       
  - platform: gpio
    id: Blue_LED
    internal: true
    name: "Blue LED"  
    pin:
      number: GPIO19
      mode: output
 
# ---------------------------- SENSOR ---------------------------- #     
sensor:
  - platform: dallas_temp
    one_wire_id: bus1
    name: Temperature Probe
    update_interval: 30s

  - platform: ads1115 # DC Volts
    multiplexer: "A0_GND"
    id: a0_gnd
    gain: 4.096
    name: "A0 (DCV)"
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15       

  - platform: ads1115 # CC6921 Output 1
    multiplexer: "A1_GND"
    id: a1_gnd
    gain: 4.096
    name: "A1 (I1)"
    internal: ${ShowRAWADVals}
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15    

  - platform: ads1115 # CC6921 Output 2
    multiplexer: "A2_GND"
    id: a2_gnd
    gain: 4.096
    name: "A2 (I2)"
    internal: ${ShowRAWADVals}
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15    

  - platform: ads1115 # NTC
    multiplexer: "A3_GND"
    id: a3_gnd
    gain: 4.096
    name: "A3 (NTC)"
    internal: ${ShowRAWADVals}
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15       

 # ------------------------------------------------- #    
# Calibration values for 48-60V #

  - platform: template
    name: "Voltage"
    id: calc_volts
    unit_of_measurement: V
    update_interval: 5s
    lambda: |-
      float VoltRaw = ((id(a0_gnd).state * 30.9369) + 0.53);  
      return (VoltRaw); 

# ------------------------------------------------- #   
# Battery Bank [BattBanks] Multiplier added as a temporary workaround for summing multiple sensors into a single HA value.   

  - platform: template
    name: "Current"
    id: calc_amps
    unit_of_measurement: A
    update_interval: 1s
    lambda: |-
      int BattBanks = 1;
      float VoltRaw = (id(a1_gnd).state + id(a2_gnd).state);
      float VoltRaw2 = (id(a1_gnd).state + id(a2_gnd).state) - 3.3;
      float dcCAR = (VoltRaw2 / 0.013200) + id(DCCALValue);
      float DCPower = id(a0_gnd).state * dcCAR;
      ESP_LOGD("Current", "VR1 %f, VR2 %f, DCCAR %f, DCP %f", VoltRaw, VoltRaw2, dcCAR, DCPower);
      return (dcCAR * BattBanks);  
      
  - platform: template
    name: "Percentage"
    id: calc_percentage        
    unit_of_measurement: '%'
    update_interval: 5s    
    lambda: |-
      float VoltRaw = (id(calc_volts).state);
      float BattState = 0;
      if (VoltRaw <= 40 ) 
        BattState = 0; 
      if (VoltRaw > 40 and VoltRaw < 46.0 ) 
        BattState = 1; 
      if (VoltRaw > 46 and VoltRaw < 46.9 ) 
        BattState = 2;                   
      if (VoltRaw >= 46.9 and VoltRaw < 47.9 ) 
        BattState =  5;
      if (VoltRaw >= 47.9 and VoltRaw < 48.3 ) 
        BattState =  10;
      if (VoltRaw >= 48.3 and VoltRaw < 48.9 ) 
        BattState =  20;   
      if (VoltRaw >= 48.9 and VoltRaw < 49.5 ) 
        BattState =  40;     
      if (VoltRaw >= 49.5 and VoltRaw < 50.2 ) 
        BattState =  50;             
      if (VoltRaw >= 50.2 and VoltRaw < 50.5 ) 
        BattState =  60;          
      if (VoltRaw >= 50.5 and VoltRaw < 50.6 ) 
        BattState =  80;          
      if (VoltRaw >= 50.6 and VoltRaw < 51.6 ) 
        BattState =  90;           
      if (VoltRaw >= 51.6 and VoltRaw < 54.4 ) 
        BattState =  100;      
      if (VoltRaw >= 54.4 and VoltRaw < 58.4 ) 
        BattState =  888;     
      if (VoltRaw >= 58.4) 
        BattState =  999;  

      ESP_LOGD("BatteryState", "VoltRaw %f, BattState %f", VoltRaw, BattState);        
      return (BattState);  
                                
# ------------------------------------------------- #    
  - platform: template
    name: "Power"
    id: calc_watts
    unit_of_measurement: W
    update_interval: 1s        
    lambda: |-
      float VoltRaw = (id(a1_gnd).state + id(a2_gnd).state);
      float VoltRaw2 = (id(a1_gnd).state + id(a2_gnd).state) - 3.3;
      float DCVoltage = (id(calc_volts).state);  
      float DCPower = (id(calc_amps).state) * DCVoltage;
      ESP_LOGD("Power", "Voltage %f, Current %f, Power %f", DCVoltage, (id(calc_amps).state), DCPower); 
      return (DCPower);

# ------------------------------------------------- #           
  - platform: template
    name: "PCB Temperature"
    id: pcb_temperature
    unit_of_measurement: °C
    update_interval: 5s     
    lambda: |-
      float Vo = ((id(a3_gnd).state)); 
      float FIX_R = 8000; // Nominal 10K
      float NTC_B = 0;    // β K (Default 3450)
      int NTC_R = (FIX_R) / (Vo - 1.0);
      float logNTC;
      float c1 = 1.009249522e-03, c2 = 2.378405444e-04, c3 = 2.019202697e-07;
      logNTC = log(NTC_R + NTC_B);
      float BoardTemperatureK = (1.0 / (c1 + c2 * logNTC + c3 * logNTC * logNTC * logNTC));
      float BoardTemperatureC = BoardTemperatureK - 273.15;       // Celsius
      float BoardTemperatureF = (BoardTemperatureC * 1.8) + 32.0; // Fahrenheit
      ESP_LOGD("NTC", "Raw %.0f, TempC %.2f\u00B0C, TempF %.2f\u00B0F", id(a3_gnd).state, BoardTemperatureC, BoardTemperatureF);    
      return (BoardTemperatureC);   

# ---------------------------- DISPLAY ---------------------------- #       
display:
  - platform: ssd1306_i2c
    id: i2cdisplay
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |- 
      it.printf(24, 0, id(font24), TextAlign::TOP_LEFT, "%.1f V", id(calc_volts).state);
      it.printf(20, 21, id(font24), TextAlign::TOP_LEFT, "%.0f W", id(calc_watts).state);          
      it.printf(0, 42, id(font24), TextAlign::TOP_LEFT, "%.0f %%", id(calc_percentage).state);   
      it.printf(68, 42, id(font24), TextAlign::TOP_LEFT, "%.0f °C", id(pcb_temperature).state);

# ---------------------------- TEXT SENSOR ---------------------------- #        
text_sensor:
  - platform: template
    name: "Author"
    entity_category: diagnostic
    lambda: |-
      return {"${author}"};
      
  - platform: template
    name: "Release Date"
    entity_category: diagnostic
    lambda: |-
      return {"${release_date}"};

  - platform: template
    name: "Board Name"
    entity_category: diagnostic
    lambda: |-
      return {"${board_name}"};

  - platform: template
    name: "Board MCU"
    entity_category: diagnostic
    lambda: |-
      return {"${board_mcu}"};

  - platform: template
    name: "Board Build"
    entity_category: diagnostic
    lambda: |-
      return {"${board_rev}"};      

  - platform: template
    name: "Board Target"
    entity_category: diagnostic
    lambda: |-
      return {"${board_target}"};        

  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    lambda: |-
      return {"${firmware_version}"};      

  - platform: template
    name: "PCB Temperature Status"
    lambda: |-
      float t=id(pcb_temperature).state;
      if (t<0) return {"Cold"};
      if (t<15) return {"Cool"};
      if (t<40) return {"Normal"};
      if (t<55) return {"Warm"};
      if (t<70) return {"Hot"};
      return {"Very Hot!"};

# ---------------------------- NUMBER ---------------------------- #        
number:
  - platform: template
    name: "Current Low Threshold"
    id: current_low_threshold
    optimistic: true
    restore_value: true
    entity_category: config
    min_value: 0
    max_value: "${current_max_default}" 
    step: 5
    initial_value: "${current_low_default}"
    unit_of_measurement: A
    mode: slider
    
  - platform: template
    name: "Current Mid Threshold"
    id: current_mid_threshold
    optimistic: true
    restore_value: true
    entity_category: config
    min_value: 0
    max_value: "${current_max_default}" 
    step: 5
    initial_value: "${current_mid_default}"
    unit_of_measurement: A
    mode: slider

  - platform: template
    name: "Current High Threshold"
    id: current_high_threshold
    optimistic: true
    restore_value: true
    entity_category: config
    min_value: 0
    max_value: "${current_max_default}" 
    step: 5
    initial_value:  "${current_high_default}"
    unit_of_measurement: A
    mode: slider

  - platform: template
    name: "Current Max Threshold"
    id: current_max_threshold
    optimistic: true
    restore_value: true
    entity_category: config
    min_value: 0
    max_value: "${current_max_default}" 
    step: 5
    initial_value:  "${current_max_default}"
    unit_of_measurement: A
    mode: slider


