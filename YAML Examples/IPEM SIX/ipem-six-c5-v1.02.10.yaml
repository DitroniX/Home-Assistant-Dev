  # --------------------------------------
  # ADC0 - ADC Scaled Voltage from VDC
  # --------------------------------------

  - platform: ads1115
    multiplexer: A0_GND
    gain: 4.096
    id: adc0_raw
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 50
          send_every: 50

  - platform: template
    name: "ADC Scaled Voltage VDC"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 2
    lambda: |-
      float voltage;
      voltage =
        (id(adc0_raw).state *
        id(dc_voltage_factor))
        +
        id(dc_voltage_drop);
      if (voltage < 0.010)
        voltage = 0;
      return voltage;

  # -----------------------------------------
  # ADC1 - ADC Scaled Voltage from ADC1 Input
  # -----------------------------------------

  - platform: ads1115
    multiplexer: A1_GND
    gain: 4.096
    id: adc1_raw
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 50
          send_every: 50

  - platform: template
    name: "ADC Scaled Voltage ADC1"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      float voltage =
        (id(adc1_raw).state *
        id(adc_voltage_factor))
        +
        id(dc_voltage_drop);
      if (voltage < 0.65)
        voltage = 0;
      return voltage;


