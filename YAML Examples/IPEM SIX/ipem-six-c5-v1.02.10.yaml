      }
      return {"Unknown"};

  - platform: template
    name: "Config Current Inputs"
    entity_category: config
    lambda: |-
      return {"${current_inputs}"};

  - platform: template
    name: "Config Banks"
    entity_category: config
    lambda: |-
      return {"${current_banks}"};      

  - platform: template
    name: "Config Current Sensor"
    entity_category: config
    lambda: |-
      return {"${current_type}"};

  - platform: template
    name: "Config Product"
    icon: mdi:information
    entity_category: config
    update_interval: 60s
    lambda: |-
      return {"Professional Energy Monitor"};

  - platform: template
    name: "Config Hardware"
    entity_category: config
    icon: mdi:information
    update_interval: 60s
    lambda: |-
      return {"ESP32-C5 Dual ATM90E32"};

  - platform: template
    name: "Configuration"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 60s

    lambda: |-
      return {"6 Channel Dual Bank CT Meter"};

  - platform: template
    name: "Mains Voltage Test Status"
    icon: mdi:heart-pulse

    lambda: |-

      if(id(mains_voltage).state < 90)
        return {"Voltage Fault"};

      if(id(mains_voltage).state > 250)
        return {"Voltage Warning"};        

      if(id(bank_a_total_current).state > 99 || id(bank_b_total_current).state > 99)
        return {"Warning: Over Current"};          

      if(id(wifi_signal_db).state < -80)
        return {"Signal Warning"};

      return {"Healthy"};

    update_interval: 15s

  - platform: template
    name: "WiFi Signal Quality"
    id: wifi_signal_quality
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(wifi_signal_db).has_state()) {
        return {"No Signal"};
      }

      int rssi = abs((int)id(wifi_signal_db).state);

      if (rssi <= 30) {
        return {"Signal Very Strong"};
      } else if (rssi <= 50) {
        return {"Signal Excellent"};
      } else if (rssi <= 60) {
        return {"Signal Healthy"};
      } else if (rssi <= 70) {
        return {"Signal Very Good"};
      } else if (rssi <= 80) {
        return {"Signal Good"};
      } else if (rssi <= 90) {
        return {"Signal Poor - Try Moving Position"};
      } else if (rssi <= 100) {
        return {"Signal Very Low - Move Position"};
      } else {
        return {"No Signal"};
      }

  # =====================================================
  # VOLTAGE INFORMATION
  # =====================================================

  # Example Mains Voltage range in the UK.
  # 230V -6% / +10%
  # Low    < 216V
  # Normal 216V - 253V
  # High   > 253V

  - platform: template
    name: "Mains Voltage Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float volt = id(mains_voltage).state; 
      if (volt <= 10.0) return {"No Signal"};

      std::string nom = "${nominal_voltage}"; 

      if (nom == "230V") {
        if (volt < 200.0) return {"Low"};
        if (volt > 260.0) return {"High"};
        if (volt < 210.0 || volt > 250.0) return {"Warning"};
      } 
      else if (nom == "120V") {
        if (volt < 100.0) return {"Low"};
        if (volt > 135.0) return {"High"};
        if (volt < 108.0 || volt > 127.0) return {"Warning"};
      }
      return {"Normal"};

  # =====================================================
  # FREQUENCY INFORMATION
  # =====================================================

  # Mains Frequency ranges.
  # Europe and UK which typically is 230 V @ 50 Hz

  # With ranges around 216 V to 253 V
  # USA and Canada which typically is 120 V or 230 V @ 60 Hz

  # With ranges around 114 V to 126 V

  # Japan which typically is 100 V @ 50 Hz or 60 Hz
  # Eastern Japan is 50 Hz, and Western Japan is 60 Hz

  # World typically is 220V-240 V @ 50 Hz

  # Based on 50 Hz
  # Low     <49 Hz
  # Normal  49-51 Hz
  # High    >51 Hz

  - platform: template
    name: "Mains Frequency Status"
    icon: mdi:waves-arrow-right
    update_interval: 10s

    lambda: |-
      float freq = id(mains_frequency).state;
      if (freq <= 0.0) return {"No Signal"};

      if (${line_frequency_hz} == 50) {
        if (freq < 49.0) return {"Low"};
        if (freq > 51.0) return {"High"};
      } else if (${line_frequency_hz} == 60) {
        if (freq < 59.0) return {"Low"};
        if (freq > 61.0) return {"High"};
      }
      return {"Normal"};

  - platform: template
    name: "Meter Type"
    entity_category: diagnostic

    lambda: |-
      return {"IPEM SIX - Dual ATM90E32 / 6 Channel"};

  # =====================================================
  # HEALTH
  # =====================================================

  - platform: uptime
    name: "Uptime"

  # =====================================================
  # CT CHANNEL ACTIVITY STATUS
  # =====================================================

  # ====================== BANK A STATUS ======================
  - platform: template
    id: bank_a_1_status
    name: "${bank_a_1_name} Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float current = id(bank_a_1_current).state;
      if (current >= id(high_load_threshold).state) return {"High Load"};
      if (current >= id(ct_activity_threshold).state) return {"Active"};
      return {"Idle"};

  - platform: template
    id: bank_a_2_status
    name: "${bank_a_2_name} Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float current = id(bank_a_2_current).state;
      if (current >= id(high_load_threshold).state) return {"High Load"};
      if (current >= id(ct_activity_threshold).state) return {"Active"};
      return {"Idle"};

  - platform: template
    id: bank_a_3_status
    name: "${bank_a_3_name} Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float current = id(bank_a_3_current).state;
      if (current >= id(high_load_threshold).state) return {"High Load"};
      if (current >= id(ct_activity_threshold).state) return {"Active"};
      return {"Idle"};

  # ====================== BANK B STATUS ======================
  - platform: template
    id: bank_b_1_status
    name: "${bank_b_1_name} Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float current = id(bank_b_1_current).state;
      if (current >= id(high_load_threshold).state) return {"High Load"};
      if (current >= id(ct_activity_threshold).state) return {"Active"};
      return {"Idle"};

  - platform: template
    id: bank_b_2_status
    name: "${bank_b_2_name} Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float current = id(bank_b_2_current).state;
      if (current >= id(high_load_threshold).state) return {"High Load"};
      if (current >= id(ct_activity_threshold).state) return {"Active"};
      return {"Idle"};

  - platform: template
    id: bank_b_3_status
    name: "${bank_b_3_name} Status"
    icon: mdi:flash
    update_interval: 10s

    lambda: |-
      float current = id(bank_b_3_current).state;
      if (current >= id(high_load_threshold).state) return {"High Load"};
      if (current >= id(ct_activity_threshold).state) return {"Active"};
      return {"Idle"};

  - platform: template
    name: "${tmp102_name} Status"
    icon: mdi:thermometer
    entity_category: diagnostic
    lambda: |-
      float t = id(tmp102_temp_c).state;
      if (t < 0)   return {"Very Cold"};
      if (t < 15)  return {"Cold"};
      if (t < 30)  return {"Normal"};
      if (t < 30)  return {"Normal"};
      if (t < 36)  return {"Quiet Warm"};      
      if (t < 45)  return {"Warm"};
      if (t < 55)  return {"Hot"};      
      if (t < 65)  return {"Very Hot"};      
      return {"Hot"};
    update_interval: 30s

################################## SENSOR ##################################

sensor:
  # ================================================================================
  # TMP102 PCB Board Ambient Temperature - Will always be warmer than actual Ambient
  # ================================================================================

  - platform: tmp102
    name: "${tmp102_name}  C"
    id: tmp102_temp_c
    i2c_id: i2c_bus
    address: 0x4A # As used in your Arduino code
    update_interval: ${tmp102_update_interval}
    accuracy_decimals: 2
    device_class: "temperature"
    state_class: "measurement"
    entity_category: diagnostic
    unit_of_measurement: " C"
    icon: "mdi:thermometer"
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 3

  - platform: template
    name: "${tmp102_name}  F"
    id: tmp102_temp_f
    # device_class: "temperature"
    state_class: "measurement"
    entity_category: diagnostic
    unit_of_measurement: " F"
    update_interval: ${tmp102_update_interval}
    accuracy_decimals: 2
    icon: "mdi:thermometer"
    lambda: |-
      return (id(tmp102_temp_c).state * 9.0 / 5.0) + 32.0;
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 3

  - platform: template
    name: "Line Voltage Setting"
    unit_of_measurement: V
    device_class: voltage
    # state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: |-
      return round(id(average_line_voltage).state);
    update_interval: 2s          

  - platform: template
    name: "Line Voltage L1"
    id: line_voltage_l1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    lambda: |-
      return id(mains_voltage).state;
    update_interval: 2s

  - platform: template
    name: "Line Voltage L2"
    id: line_voltage_l2
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    lambda: |-
      return id(mains_voltage).state;
    update_interval: 2s

  - platform: template
    name: "Line Voltage L3"
    id: line_voltage_l3
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    lambda: |-
      return id(mains_voltage).state;
    update_interval: 2s

  - platform: template
    id: average_line_voltage
    name: "Average Line Voltage"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      float v1=id(line_voltage_l1).state;
      float v2=id(line_voltage_l2).state;
      float v3=id(line_voltage_l3).state;
      float sum=0; int n=0;
      if(v1>1){sum+=v1;n++;}
      if(v2>1){sum+=v2;n++;}
      if(v3>1){sum+=v3;n++;}
      return n?sum/n:0;
    update_interval: 2s

  - platform: template
    name: "Voltage Difference"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    lambda: |-
      float vals[3]={id(line_voltage_l1).state,id(line_voltage_l2).state,id(line_voltage_l3).state};
      float mn=10000,mx=0;
      bool ok=false;
      for(int i=0;i<3;i++){if(vals[i]>1){ok=true;if(vals[i]<mn)mn=vals[i];if(vals[i]>mx)mx=vals[i];}}
      return ok?mx-mn:0;
    update_interval: 2s

  - platform: template
    id: minimum_line_voltage
    name: "Minimum AVG Line Voltage"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      static float minimum = 10000.0f;
  
      // Reset requested
      if (id(reset_voltage_stats)) {
        minimum = 10000.0f;
      }
  
      float v = id(average_line_voltage).state;
  
      if (v > 1.0f && v < minimum)
        minimum = v;
  
      return minimum;
    
  - platform: template
    id: maximum_line_voltage
    name: "Maximum AVG Line Voltage"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      static float maximum = 0.0f;
  
      // Reset requested
      if (id(reset_voltage_stats)) {
        maximum = 0.0f;
        id(reset_voltage_stats) = false;   // Clear the reset request once
      }
  
      float v = id(average_line_voltage).state;
  
      if (v > maximum)
        maximum = v;
  
      return maximum;

  
  # =====================================================
  # BANK A
  # CS GPIO6
  # =====================================================

  - platform: atm90e32

    id: bank_a

    cs_pin: GPIO6
    gain_pga: ${gain_pga_baseline}
    line_frequency: ${line_frequency}

    phase_a:
      voltage:
        name: "Mains Voltage"
        id: mains_voltage

      current:
        name: "${bank_a_1_name} Current"
        id: bank_a_1_current

      power:
        name: "${bank_a_1_name} Power"
        id: bank_a_1_power

      reactive_power:
        name: "${bank_a_1_name} Reactive Power"

      power_factor:
        name: "${bank_a_1_name} Power Factor"

      gain_voltage: ${gain_voltage_baseline1}
      gain_ct: ${gain_current_baseline}

    phase_b:
      current:
        name: "${bank_a_2_name} Current"
        id: bank_a_2_current

      power:
        name: "${bank_a_2_name} Power"
        id: bank_a_2_power

      gain_voltage: ${gain_voltage_baseline1}
      gain_ct: ${gain_current_baseline}

    phase_c:
      current:
        name: "${bank_a_3_name} Current"
        id: bank_a_3_current

      power:
        name: "${bank_a_3_name} Power"
