# Dave Williams, DitroniX 2019-2026 (ditronix.net)
# IPEM SIX - ESP32-C5 | ATM90E32 | WiFi 2.4/5GHz | Zigbee | Bluetooth | SIX Channel IoT Mains Power Energy Monitor

# July 2026: Example Code, to demonstrate and test the IPEM SIX

# Remember!
# - Set the BOARD to Use ESP32C5 Dev Module (or similar).
# - You can also set the BAUD rate up to 921600 to speed up flashing.
# - The SDK does NOT need external power to flash.  It will take Power from the USB 5V.
# - The Serial Monitor is configured for BAUD 115200

# The purpose of this test code is to cycle through the various main functions of the board as part of bring up testing.

# This test code is OPEN SOURCE and formatted for easier viewing.  Although is is not intended for real world use, it may be freely used, or modified as needed.
# It is distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.

# For board configuration, see github.com/DitroniX/IPEM-SIX-ESP32C5-ATM90E32-IoT-Mains-Power-Energy-Monitor/wiki/Arduino-IDE

# Further information, details and examples can be found on our website or github.com/DitroniX

# * ditronix.net
# * github.com/DitroniX
# * github.com/DitroniX/IPEM-SIX-ESP32C5-ATM90E32-IoT-Mains-Power-Energy-Monitor
# * github.com/DitroniX/IPEM-SIX-ESP32C5-ATM90E32-IoT-Mains-Power-Energy-Monitor/wiki
# * hackster.io/DitroniX/ipem-six-esp32c5-atm90e32-iot-mains-power-energy-monitor-e323bd

# This YAML code has been created to show the features and functionality of IPEM SIX.  This code has expanded to become an all encompassing ESPHome applicaition.
# IPEM SIX C5 is a professional 6-channel dual-bank energy monitoring device based on the ESP32-C5 platform and dual ATM90E32 energy measurement ICs.
# Initial code is for single phase and six current clamps.  Multi-phase and Rogorski Coil integrations to flow.

esphome:
  name: ipem-six-c5
  friendly_name: IPEM SIX C5

  on_boot:
    priority: -100
    then:
      - delay: 1s
      - light.turn_on:
          id: heartbeat_led
          effect: "Boot RGB Test"

esp32:
  board: esp32-c5-devkitc-1
  variant: esp32c5
  framework:
    type: esp-idf

################################## ESPHOME ##################################

# ======================== ESPHome - Enter Below our Key/pasaword ===========================

api:
  encryption:
    key: "wL8brpkPajcBD7I4QBnMFeOr1YKXt6yaKVdblPPulmw="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: IPEM SIX C5 Fallback Hotspot
    password: "mkKRW1dsMcff"

################################## SUBSTITUTIONS ##################################
substitutions:
  # ======================== About ===========================

  author: "DitroniX - Dave Williams"
  firmware_version: "1.02.10"
  release_date: "2026-07-31"
  board_name: "IPEM SIX"
  board_mcu: "ESP32-C5"
  board_rev: "1.2606.102"

  #=============== Current Input Names - Update to your preferred naming convention ===============

   # BANK A
  
  bank_a_1_name: "CTA-1"
  bank_a_2_name: "CTA-2"
  bank_a_3_name: "CTA-3"

 # BANK B
  
  bank_b_1_name: "CTB-1"
  bank_b_2_name: "CTB-2"
  bank_b_3_name: "CTB-3"

  # ======================== MAINS CONFIG ===========================
  # 230V 50Hz for UK/Europe/Eastern Japan/Most of World etc.
  # 100V,120V 60Hz for US/Canada/Western Japan etc.
  # Line Voltage is auto detected.  You may need to adjust the gain_voltage_baselines to correct the voltage.
 
  line_frequency_hz: "50" #  Leave off the Hz
 
  line_frequency: "${line_frequency_hz}Hz"   # 50 becomes "50Hz"
 
  # ===============================================================

  # ======================== BOARD CONFIG ===========================

  # AC Voltage Configuration
  # 1 = Single Phase
  # 2 = Split Phase (L1 & L3)
  # 3 = Three Phase (L1, L2 & L3)
  phases_inputs: 1 # Baseline of this version of firmware.  For later use.
  
  # AC Current Configuration
  current_inputs: 6 # Baseline of this version of firmware.  For later use.
  current_banks: 2 # Baseline of this version of firmware.  For later use.  
  current_type: "CT" # Baseline of this version of firmware.  For later use.  CT / Rogowski
  # ===============================================================

  # ==================== ATM90E32 Registers ========================
  gain_voltage_baseline1: 38300 # Voltage Line Input 1 (L1) - Baseline for 240V (Default 38300)
  gain_voltage_baseline2: 38300 # Voltage Line Input 2 (L2) - Baseline for 240V (Default 38300)
  gain_voltage_baseline3: 38300 # Voltage Line Input 3 (L3) - Baseline for 240V (Default 38300)
  
  gain_current_baseline: 64800 # Baseline for CT (Default 64800)
  gain_pga_baseline: 2X # Baseline for CT (Default 2X) 
  # ===============================================================

  # ========================= MISC ================================
  tmp102_name: "Temperature"
  tmp102_update_interval: 30s
  # ===============================================================

  project:
    name: "ditronix.ipem_six"
    version: "${firmware_version}"

captive_portal:

logger:
  level: WARN

# ========================== GPIO =============================  

# =====================================================
# SPI BUS
# =====================================================

spi:
  clk_pin: GPIO10
  mosi_pin: GPIO8
  miso_pin: GPIO9

# =====================================================
# I2C TMP102
# =====================================================

i2c:
  id: i2c_bus
  sda: GPIO2
  scl: GPIO3
  frequency: 400kHz
  scan: true

# =====================================================
# ADS1115 16-bit ADC
# Address 0x49
# =====================================================

ads1115:
  address: 0x49

# =====================================================
# ADS1115 USER CALIBRATION VALUES
# =====================================================

globals:
  - id: average_samples
    type: int
    initial_value: "50"

  - id: dc_voltage_factor
    type: float
    initial_value: "9.0588235"

  - id: adc_voltage_factor
    type: float
    initial_value: "24.105"

  - id: dc_voltage_drop
    type: float
    initial_value: "0.54"

  - id: reset_voltage_stats
    type: bool
    restore_value: no
    initial_value: "false"    

################################## BUTTON ##################################    
button:
  - platform: template
    name: "Reset Voltage Statistics"
    entity_category: config
    on_press:
      then:
        - lambda: |-
            // Reset the stored values
            id(reset_voltage_stats) = true;    

################################## LIGHT ##################################
light:
  # =====================================================
  # HEARTBEAT
  # =====================================================

  - platform: esp32_rmt_led_strip
    id: heartbeat_led
    # name: "Heartbeat LED"
    pin: GPIO27
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB

    effects:
    ####################################################
    # Boot RGB Test on Power Up
    ####################################################
    - addressable_lambda:
        name: "Boot RGB Test"
        update_interval: 250ms
  
        lambda: |-
          static uint8_t step = 0;
    
          switch (step) {
            case 0:
              it[0] = Color(255, 0, 0);       // Red
              break;
    
            case 1:
              it[0] = Color(0, 255, 0);       // Green
              break;
    
            case 2:
              it[0] = Color(0, 0, 255);       // Blue
              break;
    
            case 3:
              it[0] = Color(255, 255, 255);   // White
              break;
    
            default:
              // Return to heartbeat after one complete cycle
              auto call = id(heartbeat_led).turn_on();
              call.set_effect("Green Heartbeat");
              call.perform();
    
              step = 0;
              return;
          }
    
          step++;
  
    ####################################################
    # Green Heartbeat
    ####################################################
    - addressable_lambda:
        name: "Green Heartbeat"
        update_interval: 50ms
  
        lambda: |-
          static uint8_t step = 0;
          uint8_t b = 0;
  
          if (step == 0 || step == 2)
            b = 30;
          else if (step == 1 || step == 3)
            b = 10;
  
          it[0] = Color(0, b, 0);
  
          step++;
          if (step > 20)
            step = 0;

################################## NUMBER ##################################
number:
  # =====================================================
  # USER ADJUSTMENTS
  # =====================================================

  - platform: template
    name: "CT Activity Threshold"
    id: ct_activity_threshold
    min_value: 0.100
    max_value: 5.00
    step: 0.100
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: 0.100

  - platform: template
    name: "High Load Threshold"
    id: high_load_threshold
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: 10

#################################### TEXT #######################################
text:

